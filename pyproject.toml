[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shapetrap"
version = "0.5.1"
description = "Cross-dataset audit of benign input shift in lightweight web-injection detectors"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "scikit-learn>=1.5", "pyyaml", "zstandard", "lightgbm"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
shapetrap = "shapetrap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
shapetrap = ["crs/harness.c"]
