[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shapetrap"
version = "0.7.0"
description = "Cross-dataset audit of benign input shift in lightweight web-injection detectors"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "scikit-learn>=1.5", "pyyaml", "zstandard", "lightgbm"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[project.scripts]
shapetrap = "shapetrap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
shapetrap = ["crs/harness.c"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
